name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Scans and installer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret and denylist scans read all of history

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          # sha256 from the release's gitleaks_${GITLEAKS_VERSION}_checksums.txt
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      - name: Secret scan, denylist and file hygiene
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          if [ -n "$DENYLIST" ]; then
            DUCKHERD_DENYLIST="$RUNNER_TEMP/denylist.txt"
            printf '%s\n' "$DENYLIST" > "$DUCKHERD_DENYLIST"
            export DUCKHERD_DENYLIST
          else
            export DUCKHERD_DENYLIST=/nonexistent
          fi
          sh scripts/prepublish.sh --scan-only

      - name: Installer tests
        run: sh scripts/test-install.sh

  # The mod's own tests import 'claude-code/testing', which only the Claude Code CLI provides, and the
  # typecheck needs the type stubs it writes (.claude-plugin/types, not committed). So there is no
  # bun/node way to run them. This job installs the oldest CLI the README promises (2.1.295) and runs
  # `claude plugin test`; a failing test fails the build. Also run `sh scripts/prepublish.sh` locally before a release.
  plugin-tests:
    name: Plugin tests (needs the Claude Code CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.295
      - name: Run the plugin tests
        run: claude plugin test .
